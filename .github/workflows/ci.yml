name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 发布前自检（语法 / 可导入 / 文档索引）
        run: python tools/smoke.py
